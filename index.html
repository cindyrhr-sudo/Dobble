    <title>Klassen-Dobble mit Leveln</title>
<link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Klassen-Dobble">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="style.css">

<body class="bg-slate-100 h-screen w-screen flex flex-col p-3 overflow-hidden font-sans">

    <!-- Header & Level Selection -->
    <header class="text-center pt-1 flex-none">
        <h1 class="text-xl font-bold text-slate-800">Klassen-Dobble</h1>
        <div class="flex justify-center gap-2 mt-2">
            <button onclick="setLevel(1)" id="btn-lvl1" class="px-3 py-1 text-xs font-bold rounded-lg transition bg-indigo-600 text-white shadow">Level 1 (5 Symbole)</button>
            <button onclick="setLevel(2)" id="btn-lvl2" class="px-3 py-1 text-xs font-bold rounded-lg transition bg-slate-200 text-slate-700">Level 2 (9 Symbole)</button>
            <button onclick="setLevel(3)" id="btn-lvl3" class="px-3 py-1 text-xs font-bold rounded-lg transition bg-slate-200 text-slate-700">Level 3 (12 Symbole)</button>
        </div>
    </header>

    <!-- Game Area: nimmt den kompletten verfügbaren Platz zwischen Header und Footer
         ein (flex-1 min-h-0), Kartengröße wird per JS an diesen Platz angepasst. -->
    <main class="game-container flex flex-col items-center justify-center gap-6 flex-1 min-h-0 w-full max-w-5xl mx-auto">
        <div class="flex flex-col items-center justify-center min-w-0 min-h-0">
            <div id="card1" class="card"></div>
        </div>
        <div class="flex flex-col items-center justify-center min-w-0 min-h-0">
            <div id="card2" class="card"></div>
        </div>
    </main>

    <!-- Controls at the bottom -->
    <footer class="flex flex-col gap-3 items-center pb-2 pt-4 w-full max-w-md mx-auto border-t border-slate-200 flex-none">
        <div class="flex gap-4 w-full px-4">
            <button onclick="nextRound()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg text-base transition transform active:scale-95 cursor-pointer">
                Nächste Karten 🔄
            </button>
            <button onclick="showSolution()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg text-base transition transform active:scale-95 cursor-pointer">
                Auflösen ✨
            </button>
        </div>
        <div id="info-text" class="text-xs text-slate-400 text-center">
            Level 1: 21 Karten (5 Symbole pro Karte - Garantiert exakt 1 Treffer)
        </div>
    </footer>

        // ------------------------------------------------------------
        // Verstreute Anordnung mit variablen Größen und Kollisionsvermeidung
        // (klassischer Dobble-Look, statt Ring am Rand).
        //
        // Alle Maße werden relativ zur KLEINEREN Kartenbreite (270px,
        // Standard-Breakpoint) berechnet. Die Schriftgröße ist in "rem"
        // fest (skaliert nicht mit der Kartengröße), die Position wird
        // aber als Bruchteil der aktuellen Kartenbreite gerendert - beim
        // größeren Breakpoint (340px) wird dadurch automatisch mehr Platz
        // zwischen den Symbolen frei, nie weniger. So bleibt die Anordnung
        // auf jeder Bildschirmgröße überlappungsfrei.
        // ------------------------------------------------------------
        const REFERENCE_CARD_PX = 270;
        const REM_TO_PX = 16;
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~137,5°
        // Sicherheitsabstand zum ECHTEN Kartenrand (Kreis-Radius = 0.5 * Kartenbreite).
        // Der Radius jedes Symbols wird von diesem Wert abgezogen (siehe allowedMaxR
        // weiter unten), damit auch der sichtbare Rand des Emojis - nicht nur sein
        // Mittelpunkt - innerhalb der Karte bleibt.
        const SAFE_EDGE_R = 0.42;

        function getBaseFontRem(count) {
            if (count <= 5) return 3.4;
            if (count <= 9) return 2.5;
            return 2.0; // 10-13 Symbole
        }

        function footprintFracFor(rem, paddingPx) {
            const footprintPx = (rem * REM_TO_PX * 0.60) + paddingPx;
            return footprintPx / REFERENCE_CARD_PX;
        }

        // Verstreute, aber GLEICHMÄSSIGE Platzierung:
        // 1) Basis-Slots per Sonnenblumen-Verteilung (Vogel'sche Methode) - deckt die
        //    Kreisfläche mathematisch gleichmäßig ab (kein Zufalls-Klumpen, keine Lücken).
        // 2) Slots zufällig den Symbolen zugelost, damit Größe/Position nicht immer
        //    gleich zusammenfallen.
        // 3) Kollisionsvermeidung mit garantiertem Ergebnis: erst kleine Jitter-Suche
        //    nah am zugewiesenen Slot (erhält die Gleichmäßigkeit), danach eine breite
        //    Suche über die ganze Karte, zuletzt schrittweises Verkleinern - so bleibt
        //    die Anordnung IMMER überlappungsfrei UND innerhalb des Rand-Sicherheitsabstands,
        //    auch im ungünstigsten Fall.
        function generateScatterLayout(count) {
            const baseRem = getBaseFontRem(count);
            const paddingPx = 5; // zusätzlicher Mindestabstand zwischen Symbolen
            const minSizeMultiplier = 0.4; // nie kleiner als 40% der Ausgangsgröße

            const items = [];
            for (let i = 0; i < count; i++) {
                const scale = 0.85 + Math.random() * 0.35; // 0.85 - 1.20 -> unterschiedliche Größen
                const rem = baseRem * scale;
                items.push({ origIndex: i, rem, footprintFrac: footprintFracFor(rem, paddingPx) });
            }

            // Slot-Radius bereits um eine typische Footprint-Schätzung reduziert,
            // damit die Basis-Anordnung von Anfang an Rand-Sicherheitsabstand einplant.
            const typicalFootprint = footprintFracFor(baseRem, paddingPx);
            const slotMaxR = Math.max(0.1, SAFE_EDGE_R - typicalFootprint);
            const rotationOffset = Math.random() * Math.PI * 2;
            const slots = [];
            for (let i = 0; i < count; i++) {
                const idx = i + 0.5;
                const r = slotMaxR * Math.sqrt(idx / count);
                const theta = idx * GOLDEN_ANGLE + rotationOffset;
                slots.push({ x: r * Math.cos(theta), y: r * Math.sin(theta) });
            }
            for (let i = slots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [slots[i], slots[j]] = [slots[j], slots[i]];
            }

            // Größte zuerst platzieren -> bessere Packung bei Kollisionen
            const order = [...items].sort((a, b) => b.footprintFrac - a.footprintFrac);
            const placed = [];

            order.forEach((item, orderIdx) => {
                const slot = slots[orderIdx];
                let finalPos = null, finalFrac = item.footprintFrac, finalRem = item.rem;

                placementLoop:
                for (let sizeStep = 0; sizeStep < 20; sizeStep++) {
                    const sizeMultiplier = Math.max(minSizeMultiplier, Math.pow(0.88, sizeStep));
                    const testFrac = item.footprintFrac * sizeMultiplier;
                    // Erlaubter Maximalradius für DIESES Symbol - so bleibt sein
                    // sichtbarer äußerer Rand innerhalb von SAFE_EDGE_R, egal wie groß es ist.
                    const allowedMaxR = Math.max(0.05, SAFE_EDGE_R - testFrac);

                    // Phase A: kleine Jitter-Suche nah am zugewiesenen Slot
                    let bestPos = null, bestScore = -Infinity;
                    const jitterRadii = [0.02, 0.05, 0.09, 0.14, 0.20];
                    for (const jr of jitterRadii) {
                        for (let a = 0; a < 40; a++) {
                            const dx = (Math.random() * 2 - 1) * jr;
                            const dy = (Math.random() * 2 - 1) * jr;
                            const x = slot.x + dx, y = slot.y + dy;
                            if (Math.hypot(x, y) > allowedMaxR) continue;
                            let overlap = false, minMargin = Infinity;
                            for (const p of placed) {
                                const d = Math.hypot(x - p.x, y - p.y);
                                const margin = d - (testFrac + p.footprintFrac);
                                if (margin < 0) overlap = true;
                                minMargin = Math.min(minMargin, margin);
                            }
                            if (!overlap) {
                                finalPos = { x, y }; finalFrac = testFrac; finalRem = item.rem * sizeMultiplier;
                                break placementLoop;
                            }
                            if (minMargin > bestScore) { bestScore = minMargin; bestPos = { x, y }; }
                        }
                    }
                    // Phase B: breite Suche über die ganze Karte (Fallback), respektiert
                    // ebenfalls den Rand-Sicherheitsabstand für dieses Symbol.
                    for (let a = 0; a < 250; a++) {
                        const r = Math.sqrt(Math.random()) * allowedMaxR;
                        const theta = Math.random() * Math.PI * 2;
                        const x = r * Math.cos(theta), y = r * Math.sin(theta);
                        let overlap = false, minMargin = Infinity;
                        for (const p of placed) {
                            const d = Math.hypot(x - p.x, y - p.y);
                            const margin = d - (testFrac + p.footprintFrac);
                            if (margin < 0) overlap = true;
                            minMargin = Math.min(minMargin, margin);
                        }
                        if (!overlap) {
                            finalPos = { x, y }; finalFrac = testFrac; finalRem = item.rem * sizeMultiplier;
                            break placementLoop;
                        }
                        if (minMargin > bestScore) { bestScore = minMargin; bestPos = { x, y }; }
                    }
                    if (sizeMultiplier <= minSizeMultiplier) {
                        finalPos = bestPos; finalFrac = testFrac; finalRem = item.rem * sizeMultiplier;
                        break;
                    }
                }
                placed.push({ origIndex: item.origIndex, rem: finalRem, x: finalPos.x, y: finalPos.y, footprintFrac: finalFrac });
            });

            const result = new Array(count);
            placed.forEach(p => { result[p.origIndex] = { x: p.x, y: p.y, rem: p.rem }; });
            return result;
        }

        function renderCard(containerId, cardSymbols, layout, isSolution = false, commonSymbol = null) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const rect = container.getBoundingClientRect();
            const size = rect.width > 0 ? rect.width : 270;
            const cx = size / 2;
            const cy = size / 2;

            cardSymbols.forEach((sym, i) => {
                const pos = layout[i];
                const x = cx + pos.x * size;
                const y = cy + pos.y * size;

                const div = document.createElement('div');
                div.className = 'sym';

                const isMatch = isSolution && sym === commonSymbol;
                const rem = isMatch ? pos.rem * 1.2 : pos.rem;
                div.style.fontSize = `${rem}rem`;

                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                div.innerText = sym;

                if (isMatch) {
                    div.classList.add('highlight');
                }

                container.appendChild(div);
            });
        }

        function nextRound() {
            const pair = getRandomPair();
            currentCard1Idx = pair[0];
            currentCard2Idx = pair[1];

            card1Layout = generateScatterLayout(activeCards[currentCard1Idx].length);
            card2Layout = generateScatterLayout(activeCards[currentCard2Idx].length);

            renderCard('card1', activeCards[currentCard1Idx], card1Layout);
            renderCard('card2', activeCards[currentCard2Idx], card2Layout);
        }

        function showSolution() {
            const c1 = activeCards[currentCard1Idx];
            const c2 = activeCards[currentCard2Idx];

            const common = c1.find(s => c2.includes(s));

            if (common) {
                renderCard('card1', c1, card1Layout, true, common);
                renderCard('card2', c2, card2Layout, true, common);
            }
        }

        // ------------------------------------------------------------
        // Flexible Kartengröße: nutzt den tatsächlich verfügbaren Platz
        // zwischen Header und Footer, statt fixer 270/340px-Stufen.
        // MIN_CARD_PX entspricht REFERENCE_CARD_PX oben - wird die Karte
        // kleiner gerendert, würde die verifizierte Kollisionsvermeidung
        // (Abstände zwischen Symbolen) nicht mehr zuverlässig gelten,
        // deshalb ist das eine harte Untergrenze.
        // ------------------------------------------------------------
        const MIN_CARD_PX = REFERENCE_CARD_PX; // 270 - Sicherheitsgrenze der Kollisionsvermeidung
        const MAX_CARD_PX = 560; // verhindert unnötig riesige Karten auf sehr großen Bildschirmen
        const CARD_SAFETY_MARGIN_PX = 10; // zusätzlicher Puffer, damit nichts exakt an Rand/Footer klebt

        function isSideBySideLayout() {
            return window.matchMedia('(orientation: landscape) and (min-width: 768px)').matches;
        }

        function updateCardSize() {
            const main = document.querySelector('main.game-container');
            const rect = main.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return; // noch nicht gerendert

            const style = getComputedStyle(main);
            const gapPx = parseFloat(style.rowGap || style.columnGap || style.gap || '0') || 0;
            const sideBySide = isSideBySideLayout();

            let cardSize;
            if (sideBySide) {
                const availWidthPerCard = (rect.width - gapPx) / 2;
                cardSize = Math.min(availWidthPerCard, rect.height);
            } else {
                const availHeightPerCard = (rect.height - gapPx) / 2;
                cardSize = Math.min(rect.width, availHeightPerCard);
            }
            cardSize -= CARD_SAFETY_MARGIN_PX;
            cardSize = Math.max(MIN_CARD_PX, Math.min(MAX_CARD_PX, cardSize));

            const c1 = document.getElementById('card1');
            const c2 = document.getElementById('card2');
            c1.style.width = c1.style.height = `${cardSize}px`;
            c2.style.width = c2.style.height = `${cardSize}px`;
        }

        function handleResize() {
            updateCardSize();
            if (card1Layout.length > 0 && card2Layout.length > 0) {
                renderCard('card1', activeCards[currentCard1Idx], card1Layout);
                renderCard('card2', activeCards[currentCard2Idx], card2Layout);
            }
        }

        window.onload = function() {
            updateCardSize();
            nextRound();
        };

        window.onresize = handleResize;
        window.addEventListener('orientationchange', () => setTimeout(handleResize, 50));
    </script>

    <script>
        // Service Worker registrieren, damit die App nach dem ersten (Online-)Aufruf
        // auch offline funktioniert (z.B. nach "Zum Home-Bildschirm hinzufügen").
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.error('Service-Worker-Registrierung fehlgeschlagen:', err);
                });
            });
        }
    </script>
</body>
